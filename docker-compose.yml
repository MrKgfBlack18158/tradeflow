# Local infrastructure for TradeFlow.
#   docker compose up -d                 -> Kafka + MongoDB
#   docker compose --profile ui up -d    -> also Kafka UI on http://localhost:8080
# The Spring Boot services run outside Docker during development (mvn spring-boot:run),
# so they reach Kafka on localhost:9092 and MongoDB on localhost:27017.

services:
  kafka:
    image: apache/kafka:4.0.0          # KRaft mode: no ZooKeeper needed
    container_name: kafka
    ports:
      - "127.0.0.1:9092:9092"   # localhost only: not reachable from the network
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT = for apps on the host (localhost:9092); DOCKER = for other containers (kafka:29092)
      KAFKA_LISTENERS: PLAINTEXT://:9092,DOCKER://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092,DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"   # keep it small for 8 GB machines
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  mongodb:
    image: mongo:8.0
    container_name: mongodb
    ports:
      - "127.0.0.1:27017:27017" # localhost only: not reachable from the network
    volumes:
      - mongo-data:/data/db
    command: ["--wiredTigerCacheSizeGB", "0.25"]   # small cache for 8 GB machines
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-ui:
    image: kafbat/kafka-ui:v1.0.0
    container_name: kafka-ui
    profiles: ["ui"]
    ports:
      - "127.0.0.1:8080:8080"   # localhost only
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  mongo-data:
