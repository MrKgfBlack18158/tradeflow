server:
  port: 8083
  address: 127.0.0.1      # listen on this machine only, not on the network

spring:
  application:
    name: trade-query
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://127.0.0.1:27017/tradeflow}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
