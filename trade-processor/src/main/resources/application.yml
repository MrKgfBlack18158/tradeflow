server:
  port: 8082
  address: 127.0.0.1      # listen on this machine only, not on the network

spring:
  application:
    name: trade-processor
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://127.0.0.1:27017/tradeflow}
      auto-index-creation: true          # create the @Indexed(account) index on startup
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    consumer:
      group-id: trade-processor          # all processor instances share the work
      auto-offset-reset: earliest        # a brand-new group starts from the oldest message
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ErrorHandlingDeserializer stops one malformed message ("poison pill") from crashing the consumer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: com.tradeflow.processor.TradeEvent
        spring.json.use.type.headers: false

tradeflow:
  topics:
    raw: trades.raw
  risk:
    max-quantity: 1000000
    max-notional: 10000000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
